services:
  - type: web
    name: provenance-guard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --timeout 120
    envVars:
      - key: GROQ_API_KEY
        sync: false       # You set this manually in the Render dashboard
      - key: FLASK_DEBUG
        value: "false"
    healthCheckPath: /
